name: Release

# Publishes the patched ReSkateLauncher.exe as release vVERSION (the VERSION
# file). It holds no game files; ReSkate.dll comes from ReSkate's own release.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build the patched launcher
        shell: bash
        run: scripts/build-launcher.sh out
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="$(python -c 'import json; print(json.load(open("upstream.json"))["tag"])')"
          archive=out/ReSkateLauncher-armadaos.zip
          (cd out && 7z a -tzip ReSkateLauncher-armadaos.zip ReSkateLauncher.exe > /dev/null)
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Install

          ReSkate's launcher ${tag#v}, patched to start skate. under Proton on ARM64 Linux handhelds with FEX, such as the Retroid Pocket 6 on ArmadaOS. Use it with ReSkate.dll from [ReSkate ${tag#v}](https://github.com/Dingo-Shenanigans/ReSkate/releases/tag/$tag).

          On the device, in Desktop Mode, scripts/setup-armadaos.sh does everything: it puts ReSkate ${tag#v} and this launcher in ~/ReSkate, downloads the game build ReSkate supports with the native ARM64 DepotDownloader, and prints the Steam launch option. To update by hand, replace ReSkateLauncher.exe in your ReSkate folder with the one in ReSkateLauncher-armadaos.zip.

          No game files are included. SHA-256: \`$sha256\`
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "ReSkate ${tag#v} launcher for ArmadaOS ($version)" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
