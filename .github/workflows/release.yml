name: Release

# Publishes the patched ReSkateLauncher.exe and ReSkate.dll as release vVERSION (the VERSION
# file). It holds no game files; ReSkate.dll comes from ReSkate's own release.

on:
  workflow_dispatch:
  # The weekly upstream check (upstream-check.yml) releases main after merging.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Build the patched launcher
        shell: bash
        run: scripts/build.sh out
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="$(python -c 'import json; print(json.load(open("upstream.json"))["tag"])')"
          archive=out/ReSkate-armadaos.zip
          (cd out && 7z a -tzip ReSkate-armadaos.zip ReSkateLauncher.exe ReSkate.dll > /dev/null)
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Skating on the Retroid Pocket 6

          ReSkate ${tag#v}'s ReSkateLauncher.exe and ReSkate.dll, patched to behave under Proton and FEX: hooks without suspending threads, safe memory reads under Wine and much lighter per-frame work. Everything else is [ReSkate ${tag#v}](https://github.com/Dingo-Shenanigans/ReSkate/releases/tag/$tag) as released.

          First time: in a Desktop Mode terminal run \`curl -fsSL https://raw.githubusercontent.com/Ken5998/reskate-arm64/main/scripts/setup-armadaos.sh | bash\`. It sets up ~/ReSkate, downloads the skate. build ReSkate expects (about 14 GB) with an ARM64 DepotDownloader and prints the launch option to paste into Steam. Run skate. with **Proton Experimental x86_64**, not the arm64 one.

          Already set up: swap ReSkateLauncher.exe and ReSkate.dll in ~/ReSkate for the ones in ReSkate-armadaos.zip.

          SHA-256: \`$sha256\`. skate. itself comes from your Steam library (it's free).
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "ReSkate ${tag#v} launcher for ArmadaOS ($version)" \
              --notes-file notes.md --target "$(git rev-parse HEAD)"
          fi
