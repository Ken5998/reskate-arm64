name: CI

# Builds ReSkate's launcher from the commit in upstream.json with patches/
# applied, as the Windows build ReSkate's own releases ship.

on:
  push:
  pull_request:
  workflow_dispatch:
  # The weekly upstream check (upstream-check.yml) runs it on its branch.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Build the patched launcher
        shell: bash
        run: scripts/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: ReSkate-armadaos
          path: |
            out/ReSkateLauncher.exe
            out/ReSkate.dll
          if-no-files-found: error
