name: CI

# Builds ReSkate's launcher from the commit in upstream.json with patches/
# applied, as the Windows build ReSkate's own releases ship.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build the patched launcher
        shell: bash
        run: scripts/build-launcher.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: ReSkateLauncher
          path: out/ReSkateLauncher.exe
          if-no-files-found: error
